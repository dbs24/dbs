syntax = "proto3";

package userClient;
import "protobuf-response.proto";
import "google/protobuf/wrappers.proto";

option java_package = "org.dbs.tree.client";
option java_multiple_files = true;

////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////
////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////
////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////
//======================================================================================================================
// Users credentials
//======================================================================================================================
message UserCredentials {
  string userLogin = 1;
  string userPassword = 2;
  string userStatus = 3;
}

message UserCredentialsRequest {
  string userLogin = 1;
}

message  UserCredentialsResponse {
  string userLogin = 1;
  string userPassword = 2;
}

// createOrUpdate
//======================================================================================================================

message CreateOrUpdateUserRequest {
  reserved                      1 ;
  reserved                      "userId"; // 1
  optional string oldLogin = 2;
  string          login = 3;
  optional string oldEmail = 4;
  optional string email = 5;
  optional string phone = 6;
  optional string firstName = 7;
  optional string middleName = 8;
  optional string lastName = 9;
  optional string password = 10;
  optional uint32 birthDate = 11;
  //optional string status       016;
}

message  CreateOrUpdateUserResponse {
  string          userLogin = 3;
  string          status = 16;
  string          email = 5;
}

// updateStatus
//======================================================================================================================
message UpdateUserStatusRequest {
  string modifiedLogin = 1;
  string status = 2;
}

message UpdateUserStatusResponse {
  string modifiedLogin = 1;
  string newStatus = 2;
}

// updatePassword
//======================================================================================================================
message UpdateUserPasswordRequest {
  string modifiedLogin = 1;
  string newPassword = 2;
}

message UpdateUserPasswordResponse {
  string modifiedLogin = 1;
}
