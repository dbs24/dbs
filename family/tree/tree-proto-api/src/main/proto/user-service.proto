syntax = "proto3";

package userClient;
import "google/protobuf/wrappers.proto";
import "user-dto.proto";

option java_package = "org.dbs.tree.client";
option java_multiple_files = true;

service UserService {
  // User
  rpc createOrUpdateUser (CreateOrUpdateUserRequest) returns (CreateOrUpdateUserResponse) {}
  rpc getUserCredentials (UserCredentialsRequest) returns (UserCredentialsResponse) {}
  rpc updateUserStatus (UpdateUserStatusRequest) returns (UpdateUserStatusResponse) {}
  rpc updateUserPassword (UpdateUserPasswordRequest) returns (UpdateUserPasswordResponse) {}
}
