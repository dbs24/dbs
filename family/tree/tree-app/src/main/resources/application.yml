---
debug: false
trace: off
server:
  port: 8443
  ssl:
    enabled: true
    key-store: classpath:k11dev.tech.jks
    key-store-password: ${SSL_KEY_STORE_PASSWORD}
    key-store-type: jks
  servlet:
    context-path: /
    session:
      timeout: 60
grpc:
  server:
    port: 18443
    security:
      enabled: true
      certificateChain: classpath:k11dev.tech.pem
      privateKey: classpath:k11dev.tech.key
spring:
  profiles:
    active: default
  main:
    lazy-initialization: true
    web-application-type: reactive
    banner-mode: console
  jmx:
    enabled: false
  web:
    locale: en_CA
    locale-resolver: fixed
  security:
    user:
      name: user
      password: ${SPRING_SECURITY_USER_PASSWORD}
  flyway:
    enabled: true
    url: ${FLYWAY_URL}
    user: ${spring.r2dbc.username}
    password: ${spring.r2dbc.password}
    locations: classpath:db/migration
    baseline-on-migrate: true
  r2dbc:
    username: ${R2DBC_USERNAME}
    password: ${R2DBC_PASSWORD}
    url: ${R2DBC_URL}
    pool:
      enabled: true
      initial-size: 2
      max-size: 10
      validation-query: SELECT 1
      max-life-time: 7200000
      max-idle-time: 12000000
    repositories:
      enabled: true
  application:
    name: family-tree
  jackson:
    serialization:
      fail-on-empty-beans: false
  data:
    redis:
      repositories:
        enabled: true
      host: 127.0.0.1
      port: 6379
      timeout: 2000
      password: ${REDIS_PASSWORD}
  cache:
    redis:
      time-to-live: 86400
  messages:
    basename: messages
    encoding: UTF-8
    cache-duration: 3600
    use-code-as-default-message: true
    fallback-to-system-locale: true
  codec:
    max-in-memory-size: 20MB
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    listener:
      type: batch
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      auto-offset-reset: earliest
      group-id: ${spring.application.name}
      properties:
        isolation.level: read_committed
logging:
  register-shutdown-hook: false
  level:
    default: INFO
    root: ${logging.level.default}
    org.dbs: ${logging.level.default}
    org.springframework: ${logging.level.default}
    org.springframework.boot: ${logging.level.default}
    org.flywaydb: ${logging.level.default}
    org.springframework.r2dbc: ${logging.level.default}
    web: ${logging.level.default}
    reactor.netty.http.server.HttpServer: ${logging.level.default}
  config: classpath:log4j2.xml
network:
  cors:
    allowed-path: localhost
    allowed-origins:
      additional: localhost
    allowed-headers: "*"
    allowed-methods: "*"
    allowed-credentials: false
    max-age: 1
management:
  endpoint:
    health:
      show-details: always
  endpoints:
    enabled-by-default: true
    web:
      exposure:
        include: "health,info,metrics,prometheus"
  health:
    redis:
      enabled: false
  metrics:
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
  prometheus:
    metrics:
      export:
        enabled: true
springdoc:
  version: '@springdoc.version@'
  api-docs:
    enabled: false
  swagger-ui:
    use-root-path: true
    enabled: false
    operationsSorter: method
    disable-swagger-default-url: true
  cache:
    disabled: true
config:
  grpc:
    reflection:
      enabled: false
    cc-sandbox:
      server:
        host: dev01.k11dev.tech
        port: 17443
  liveness:
    hosts: { #'media-dev.k11dev.tech':9000,
      #                'admin.k11dev.tech':443,
      'google.com': 443,
      'uonmap.com': 443 }
  restful:
    return-error-2-response: true
    profile:
      name: ${spring.application.name}
    security:
      google:
        server:
          host-port: https://google.com
          recaptcha:
            v3:
              site: 6LdIcqcpAAAAAFGLJd5OIVIgUb-ujHrWud8Mphyo
              #secret: 6Lc1AowpAAAAAJLdoT_YdWHN2kAeTK9LTWvX6hoO
              secret: ${RECAPTCHA_SECRET}
              routes:
                siteverify: /recaptcha/api/siteverify
  entity:
    core:
      action:
        execution:
          async-alg-store:
            enabled: false
            delay: 50
  cache:
    jedis:
      enabled: true
  references:
    auto-synchronize: true
    privilege-group: false
    privilege: false
  security:
    security-routes:
      enabled: false
    profile:
      name: advanced
      advanced-white-uri-list: /info,/health
    jwt:
      name: standard
      secret-key: ${JWT_SECRET_KEY}
    bucket4j:
      enabled: false
      trusted-ips: localhost
